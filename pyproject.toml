[project]
name = "fastapi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Umang Agarwal", email = "umang01aga@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio<4.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
    "uvicorn[standard]>=0.52.2",
]

[project.scripts]
fastapi = "fastapi:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
